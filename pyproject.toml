[project]
name = "music-app"
version = "0.1.0"
description = "Projeto de teste da API FastAPI para o modelo de geracao de musica ACE-Step"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
kaggle = [
    "ace-step @ git+https://github.com/ace-step/ACE-Step.git",
    "pyngrok>=7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
